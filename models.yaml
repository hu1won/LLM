# LLMBench model catalog
# Users pick an id; the CLI filters by detected platform / VRAM.

models:
  - id: qwen2.5-3b
    name: Qwen2.5 3B Instruct
    hf_id: Qwen/Qwen2.5-3B-Instruct
    ollama_id: qwen2.5:3b
    params_b: 3
    min_vram_gb:
      qlora: 6
      lora: 10
      mlx: 8
    train_backends: [unsloth, transformers, mlx]
    infer_backends: [ollama, transformers, mlx]
    tags: [qwen, small, beginner]

  - id: qwen2.5-7b
    name: Qwen2.5 7B Instruct
    hf_id: Qwen/Qwen2.5-7B-Instruct
    ollama_id: qwen2.5:7b
    params_b: 7
    min_vram_gb:
      qlora: 10
      lora: 18
      mlx: 16
    train_backends: [unsloth, transformers, mlx]
    infer_backends: [ollama, transformers, mlx]
    tags: [qwen, recommended]

  - id: llama3.2-3b
    name: Llama 3.2 3B Instruct
    hf_id: meta-llama/Llama-3.2-3B-Instruct
    ollama_id: llama3.2:3b
    params_b: 3
    min_vram_gb:
      qlora: 6
      lora: 10
      mlx: 8
    train_backends: [unsloth, transformers, mlx]
    infer_backends: [ollama, transformers, mlx]
    tags: [llama, small]
    notes: "Hugging Face access may require accepting Meta's license."

  - id: llama3.1-8b
    name: Llama 3.1 8B Instruct
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    ollama_id: llama3.1:8b
    params_b: 8
    min_vram_gb:
      qlora: 12
      lora: 22
      mlx: 18
    train_backends: [unsloth, transformers, mlx]
    infer_backends: [ollama, transformers, mlx]
    tags: [llama]
    notes: "Hugging Face access may require accepting Meta's license."

  - id: mistral-7b
    name: Mistral 7B Instruct v0.3
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    ollama_id: mistral:7b
    params_b: 7
    min_vram_gb:
      qlora: 10
      lora: 18
      mlx: 16
    train_backends: [unsloth, transformers, mlx]
    infer_backends: [ollama, transformers, mlx]
    tags: [mistral]

  - id: gemma2-2b
    name: Gemma 2 2B Instruct
    hf_id: google/gemma-2-2b-it
