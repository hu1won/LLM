    params_b: 2
    min_vram_gb:
      qlora: 4
      lora: 8
      mlx: 6
    train_backends: [unsloth, transformers, mlx]
    infer_backends: [ollama, transformers, mlx]
    tags: [gemma, small, beginner]
    notes: "Good starting point on laptops with limited VRAM/unified memory."
