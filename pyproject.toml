[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmbench"
version = "0.1.0"
description = "Cross-platform local LLM workbench: pick a model, fine-tune with LoRA, chat locally."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "LLMBench contributors" }]
keywords = ["llm", "finetune", "lora", "ollama", "local"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
# NVIDIA CUDA training (Linux / Windows WSL2)
cuda = [
  "torch",
  "transformers>=4.40",
  "datasets>=2.18",
  "peft>=0.10",
  "trl>=0.8",
  "accelerate>=0.28",
  "bitsandbytes>=0.43",
]
# Apple Silicon training
mlx = [
  "mlx>=0.15",
  "mlx-lm>=0.15",
]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
  "httpx>=0.27",
]

[project.scripts]
llmbench = "llmbench.cli:app"

[project.urls]
Homepage = "https://github.com/huiwon/LLM"
Issues = "https://github.com/huiwon/LLM/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbench"]

[tool.hatch.build.targets.wheel.sources]
"src/llmbench" = "llmbench"

[tool.hatch.build.targets.wheel.force-include]
"models.yaml" = "llmbench/data/models.yaml"
"config.example.yaml" = "llmbench/data/config.example.yaml"
"data/sample_train.jsonl" = "llmbench/data/sample_train.jsonl"
"src/llmbench/web/static/index.html" = "llmbench/web/static/index.html"
"src/llmbench/web/static/styles.css" = "llmbench/web/static/styles.css"
"src/llmbench/web/static/app.js" = "llmbench/web/static/app.js"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/models.yaml",
  "/config.example.yaml",
  "/data",
  "/README.md",
  "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
